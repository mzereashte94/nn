<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AshteMobile | Premium Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { 
            --gold: #E2B750; 
            --gold-light: #F7D57B; 
            --bg-color: #0A0A0C;
            --card-bg: #141416;
            --border-color: rgba(255, 255, 255, 0.06);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-color); 
            color: #ffffff; 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            overflow-x: hidden;
        }

        /* باکگراوندی سادە و ئەستێرەدار */
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.4; }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 4s infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 1; box-shadow: 0 0 4px #fff; } }

        .main-container { width: 92%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; z-index: 10; }

        /* کارتی ئاسایی */
        .ui-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            transition: 0.3s;
        }

        /* Toggle Switch ی مۆدێرن */
        .toggle-row { display: flex; justify-content: space-between; align-items: center; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px; border: 1px solid rgba(255,255,255,0.05); }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 3px; background-color: #555; transition: .4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 50%; }
        input:checked + .slider { background-color: rgba(226, 183, 80, 0.15); border-color: rgba(226, 183, 80, 0.3); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--gold); box-shadow: 0 0 8px rgba(226, 183, 80, 0.5); }

        /* ئینپوت و درۆپداون */
        .ui-input {
            width: 100%; background: #1A1A1D; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px 16px; color: white; font-size: 14px; font-weight: 600; outline: none; transition: 0.2s; appearance: none;
        }
        .ui-input:focus { border-color: var(--gold); }
        
        .upload-box {
            background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.15); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .upload-box:active { background: rgba(226, 183, 80, 0.05); border-color: var(--gold); }

        /* دوگمەی سەرەکی */
        .btn-gold {
            background: linear-gradient(90deg, #D4A32A, #F7D57B, #D4A32A);
            background-size: 200% auto;
            color: #000; font-weight: 800; font-size: 15px; padding: 16px; border-radius: 16px; width: 100%; border: none; cursor: pointer; transition: 0.3s;
        }
        .btn-gold:active { transform: scale(0.97); }
        .btn-gold:hover { background-position: right center; }

        .btn-dark {
            background: #1A1A1D; color: #fff; border: 1px solid var(--border-color); font-weight: 600; font-size: 13px; padding: 14px; border-radius: 14px; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; transition: 0.2s; width: 100%; cursor: pointer;
        }
        .btn-dark:active { background: rgba(255,255,255,0.05); transform: scale(0.97); }

        /* لیستی ئەپەکان */
        .app-item {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .app-item:last-child { border-bottom: none; padding-bottom: 0; }
        .app-icon-img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
        
        .install-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--gold); padding: 6px 18px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .install-btn:active { background: var(--gold); color: #000; }

        /* شاردنەوەی بەشەکان */
        .hidden-sec { display: none; opacity: 0; }
        .active-sec { display: flex; flex-direction: column; opacity: 1; transition: opacity 0.3s; gap: 14px; }

        /* پرۆگرێس */
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; display: none; margin-top: 14px; }
        .progress-fill { height: 100%; width: 0%; background: var(--gold); transition: width 0.3s ease; }
        .mini-progress { display: none; align-items: center; justify-content: center; width: 60px; font-size: 12px; font-weight: 700; color: var(--gold); }
    </style>
</head>
<body>

    <div id="stars"></div>

    <div class="main-container">
        
        <!-- Header -->
        <div class="text-center mt-2 mb-2">
            <h1 class="text-[26px] font-black tracking-tight" style="color: var(--gold);">AshteMobile</h1>
            <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest font-bold">Premium Cloud Signer</p>
        </div>

        <!-- Mode Toggle -->
        <div class="ui-card toggle-row" id="toggleCard">
            <div class="flex items-center gap-2">
                <span class="text-[15px] font-bold text-gray-200" id="modeLabel">$ Free Certificate</span>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="modeToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- Premium VIP Section -->
        <form id="signForm" class="hidden-sec">
            
            <!-- هەڵبژاردنی ئەپ -->
            <div class="ui-card relative cursor-pointer" id="appSelectCard">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img src="https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Ashtemobile.jpeg" id="selImg" class="w-8 h-8 rounded-lg object-cover">
                        <span id="selName" class="font-bold text-[14px]">AshteMobile</span>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
                <!-- لیستی شاراوە -->
                <div id="appDropdown" class="absolute left-0 right-0 top-[110%] bg-[#1A1A1D] border border-[rgba(255,255,255,0.06)] rounded-xl z-50 hidden overflow-hidden shadow-2xl">
                    <div class="flex items-center gap-3 p-3 border-b border-[rgba(255,255,255,0.04)] hover:bg-[rgba(255,255,255,0.03)]" onclick="selectApp('AshteMobile', 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Ashtemobile.jpeg')">
                        <img src="https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Ashtemobile.jpeg" class="w-7 h-7 rounded-md"> <span class="font-bold text-[13px]">AshteMobile</span>
                    </div>
                    <div class="flex items-center gap-3 p-3 border-b border-[rgba(255,255,255,0.04)] hover:bg-[rgba(255,255,255,0.03)]" onclick="selectApp('ipaomtk', 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/ipaomtk.jpeg')">
                        <img src="https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/ipaomtk.jpeg" class="w-7 h-7 rounded-md"> <span class="font-bold text-[13px]">ipaomtk</span>
                    </div>
                    <div class="flex items-center gap-3 p-3 border-b border-[rgba(255,255,255,0.04)] hover:bg-[rgba(255,255,255,0.03)]" onclick="selectApp('Esign', 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Esign.jpeg')">
                        <img src="https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Esign.jpeg" class="w-7 h-7 rounded-md"> <span class="font-bold text-[13px]">Esign</span>
                    </div>
                    <div class="flex items-center gap-3 p-3 border-b border-[rgba(255,255,255,0.04)] hover:bg-[rgba(255,255,255,0.03)]" onclick="selectApp('Ksign', 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Ksign.jpeg')">
                        <img src="https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Ksign.jpeg" class="w-7 h-7 rounded-md"> <span class="font-bold text-[13px]">Ksign</span>
                    </div>
                    <div class="flex items-center gap-3 p-3 hover:bg-[rgba(255,255,255,0.03)]" onclick="selectApp('MyTV', 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/mytv.jpeg')">
                        <img src="https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/mytv.jpeg" class="w-7 h-7 rounded-md"> <span class="font-bold text-[13px]">MyTV</span>
                    </div>
                </div>
                <input type="hidden" id="appInput" value="AshteMobile">
            </div>

            <!-- Uploads -->
            <div class="ui-card !p-0 overflow-hidden">
                <div class="upload-box !border-0 !border-b !border-[rgba(255,255,255,0.04)] !rounded-none" onclick="document.getElementById('p12File').click()">
                    <div>
                        <div class="text-[14px] font-bold text-gray-200">P12 File</div>
                        <div id="p12Name" class="text-[11px] text-gray-500 mt-0.5">Click to select certificate</div>
                    </div>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    <input type="file" id="p12File" class="hidden" accept=".p12">
                </div>
                <div class="upload-box !border-0 !rounded-none" onclick="document.getElementById('provFile').click()">
                    <div>
                        <div class="text-[14px] font-bold text-gray-200">Provision File</div>
                        <div id="provName" class="text-[11px] text-gray-500 mt-0.5">Click to select provision</div>
                    </div>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                    <input type="file" id="provFile" class="hidden" accept=".mobileprovision">
                </div>
            </div>

            <input type="password" id="password" placeholder="Password" class="ui-input text-center">
            
            <button type="submit" id="submitBtn" class="btn-gold mt-1">Start Signing</button>
            <div id="progressWrapper" class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <div id="status" class="text-center text-[12px] font-bold text-gray-400 mt-1 hidden"></div>
        </form>

        <!-- Free Certificate Section -->
        <div id="freeSection" class="active-sec">
            
            <div class="ui-card">
                <label class="text-[12px] font-bold text-gray-400 block mb-2">Select Certificate:</label>
                
                <!-- تەواوی شەهادەکان لێرەدان -->
                <select id="freeCertSelect" class="ui-input mb-3 text-center !py-3">
                    <option value="File">File</option>
                    <option value="moving2">2 Moving Increasingly</option>
                    <option value="aramco">Aramco Services Company</option>
                    <option value="beijing_xibei">Beijing Xibei</option>
                    <option value="beijing_zhizhangyi">Beijing Zhizhangyi Inc</option>
                    <option value="bzi_boc">BZI BOC</option>
                    <option value="china_telecom">China Telecom Corporation Limited</option>
                    <option value="luoyang">Luoyang Postal Administration</option>
                    <option value="moving">Moving Increasingly</option>
                    <option value="powerchin">Powerchin</option>
                    <option value="qingdao">Qingdao Rural Commercial Bank Co., Ltd</option>
                    <option value="vietnam">Vietnam Rubber</option>
                    <option value="xl_axia">XL AXIATA, PT TBK</option>
                </select>

                <div class="flex gap-2">
                    <a href="https://ashtemobile.site/ashtemobile.mobileconfig" class="btn-dark flex-1">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        DNS Block
                    </a>
                    <button type="button" id="dlCertBtn" onclick="downloadCertFiles()" class="btn-dark flex-1 !text-[var(--gold)]">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        ZIP Cert
                    </button>
                </div>
            </div>
            
            <div class="ui-card">
                <div id="appsListContainer"></div>
            </div>
        </div>

    </div>

    <script>
        // دروستکردنی ئەستێرەکان بۆ باکگراوند
        const starsContainer = document.getElementById('stars');
        for(let i=0; i<40; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 4 + 's';
            starsContainer.appendChild(star);
        }

        // داتای ئەپەکان
        const appsData = [
            { id: 'AshteMobile', name: 'AshteMobile', icon: 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Ashtemobile.jpeg' },
            { id: 'ipaomtk', name: 'ipaomtk', icon: 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/ipaomtk.jpeg' },
            { id: 'Esign', name: 'Esign', icon: 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Esign.jpeg' },
            { id: 'Ksign', name: 'Ksign', icon: 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/Ksign.jpeg' },
            { id: 'MyTV', name: 'MyTV', icon: 'https://raw.githubusercontent.com/mzereashte94/Mzere/main/icons/mytv.jpeg' }
        ];

        // دانانی ئەپەکان
        const appsListContainer = document.getElementById('appsListContainer');
        appsData.forEach(app => {
            appsListContainer.innerHTML += `
                <div class="app-item">
                    <div class="flex items-center gap-3">
                        <img src="${app.icon}" class="app-icon-img">
                        <span class="text-[14px] font-bold text-gray-200">${app.name}</span>
                    </div>
                    <div>
                        <button class="install-btn" onclick="installFreeApp('${app.id}', this)">Install</button>
                        <div class="mini-progress">0%</div>
                    </div>
                </div>
            `;
        });

        // گۆڕینی دۆخ (Toggle)
        const modeToggle = document.getElementById('modeToggle');
        const modeLabel = document.getElementById('modeLabel');
        const formVIP = document.getElementById('signForm');
        const secFree = document.getElementById('freeSection');

        modeToggle.addEventListener('change', function() {
            if (!this.checked) {
                modeLabel.innerText = "$ Premium Certificate";
                secFree.classList.remove('active-sec'); secFree.classList.add('hidden-sec');
                setTimeout(() => {
                    secFree.style.display = 'none'; formVIP.style.display = 'flex';
                    setTimeout(() => { formVIP.classList.remove('hidden-sec'); formVIP.classList.add('active-sec'); }, 20);
                }, 200);
            } else {
                modeLabel.innerText = "$ Free Certificate";
                formVIP.classList.remove('active-sec'); formVIP.classList.add('hidden-sec');
                setTimeout(() => {
                    formVIP.style.display = 'none'; secFree.style.display = 'flex';
                    setTimeout(() => { secFree.classList.remove('hidden-sec'); secFree.classList.add('active-sec'); }, 20);
                }, 200);
            }
        });

        // هەڵبژاردنی ئەپ لە VIP
        const appSelectCard = document.getElementById('appSelectCard');
        const appDropdown = document.getElementById('appDropdown');
        appSelectCard.onclick = (e) => { e.stopPropagation(); appDropdown.style.display = appDropdown.style.display === 'block' ? 'none' : 'block'; };
        document.onclick = () => appDropdown.style.display = 'none';
        
        function selectApp(id, img) {
            document.getElementById('selImg').src = img;
            document.getElementById('selName').innerText = id;
            document.getElementById('appInput').value = id;
        }

        // ناوی فایلەکان
        const truncate = (str, n) => str.length > n ? str.substr(0, n - 1) + '...' : str;
        document.getElementById('p12File').onchange = e => { if(e.target.files[0]) document.getElementById('p12Name').innerText = truncate(e.target.files[0].name, 25); };
        document.getElementById('provFile').onchange = e => { if(e.target.files[0]) document.getElementById('provName').innerText = truncate(e.target.files[0].name, 25); };
        
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = error => reject(error);
        });

        async function checkStatus(buildId, appName) {
            try { const res = await fetch(`/api/status?build_id=${buildId}&app=${appName}`); return await res.json(); } catch(e) { return { status: 'processing' }; }
        }

        // دابەزاندنی ZIP
        async function downloadCertFiles() {
            const certId = document.getElementById('freeCertSelect').value;
            const baseUrl = `https://raw.githubusercontent.com/mzereashte94/nn/main/cert/${certId}`;
            const btn = document.getElementById('dlCertBtn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = 'Wait...'; btn.style.opacity = '0.5'; btn.disabled = true;

            try {
                const zip = new JSZip();
                const files = ['cert.p12', 'profile.mobileprovision', 'pass.txt'];
                for (const file of files) {
                    const res = await fetch(`${baseUrl}/${file}?v=${Date.now()}`); 
                    if(res.ok) zip.file(file, await res.blob());
                }
                const zipContent = await zip.generateAsync({type:"blob"});
                const url = window.URL.createObjectURL(zipContent);
                const a = document.createElement('a'); a.href = url; a.download = `${certId}_cert.zip`; 
                document.body.appendChild(a); a.click(); document.body.removeChild(a); window.URL.revokeObjectURL(url);
            } catch(e) { alert("Error downloading files."); }
            
            btn.innerHTML = originalText; btn.style.opacity = '1'; btn.disabled = false;
        }

        // ئینستاڵی Free
        async function installFreeApp(appName, btnElement) {
            const selectedCertId = document.getElementById('freeCertSelect').value;
            const progressEl = btnElement.nextElementSibling;
            
            btnElement.style.display = 'none';
            progressEl.style.display = 'flex';

            let pct = 0;
            const sim = setInterval(() => { if (pct < 95) { pct += Math.floor(Math.random() * 8) + 2; if (pct > 95) pct = 95; progressEl.innerText = pct + '%'; } }, 250);

            try {
                const res = await fetch('/api/sign', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ app: appName, use_free_cert: true, cert_folder: selectedCertId }) });
                if(!res.ok) throw new Error('Error');
                const data = await res.json();
                
                const checker = setInterval(async () => {
                    const serverStatus = await checkStatus(data.build_id, appName);
                    if (serverStatus.status === 'done') {
                        clearInterval(checker); clearInterval(sim);
                        progressEl.innerText = 'Ready ✓';
                        progressEl.style.color = '#34C759';
                        
                        setTimeout(() => {
                            const manifestApiUrl = `https://${window.location.host}/api/manifest?ipa=${encodeURIComponent(serverStatus.ipaUrl)}&bundle_url=${encodeURIComponent(serverStatus.bundleUrl)}&app=${encodeURIComponent(appName)}`;
                            window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifestApiUrl)}`;
                            setTimeout(() => { window.location.href = "https://t.me/ashtemobile"; }, 3000);
                        }, 500);
                    }
                }, 1200);
            } catch (err) {
                clearInterval(sim); progressEl.innerText = 'Fail'; progressEl.style.color = '#ff453a';
                setTimeout(() => { progressEl.style.display = 'none'; progressEl.style.color = 'var(--gold)'; btnElement.style.display = 'block'; }, 2000);
            }
        }

        // فۆرمی VIP
        document.getElementById('signForm').onsubmit = async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            const btn = document.getElementById('submitBtn');
            const pWrap = document.getElementById('progressWrapper');
            const pFill = document.getElementById('progressFill');
            const p12File = document.getElementById('p12File');
            const provFile = document.getElementById('provFile');
            const pass = document.getElementById('password');
            const appSelected = document.getElementById('appInput').value;

            if (!p12File.files[0] || !provFile.files[0] || !pass.value) return alert('Please attach files and password!');

            btn.style.display = 'none'; pWrap.style.display = 'block';
            status.style.display = 'block'; status.innerText = 'Uploading...';

            try {
                const p12 = await toBase64(p12File.files[0]);
                const prov = await toBase64(provFile.files[0]);

                const res = await fetch('/api/sign', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ app: appSelected, p12, prov, password: pass.value }) });
                if(!res.ok) throw new Error('Error');
                const data = await res.json();

                status.innerText = 'Signing...';
                let sim = 0; const anim = setInterval(() => { if (sim < 95) sim += 5; pFill.style.width = sim + '%'; }, 300);

                const checker = setInterval(async () => {
                    const serverStatus = await checkStatus(data.build_id, appSelected);
                    if (serverStatus.status === 'done') {
                        clearInterval(checker); clearInterval(anim); pFill.style.width = '100%';
                        status.innerText = 'Success! Installing...';
                        status.style.color = '#E2B750';
                        
                        setTimeout(() => {
                            const manifestApiUrl = `https://${window.location.host}/api/manifest?ipa=${encodeURIComponent(serverStatus.ipaUrl)}&bundle_url=${encodeURIComponent(serverStatus.bundleUrl)}&app=${encodeURIComponent(appSelected)}`;
                            window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifestApiUrl)}`;
                            setTimeout(() => { window.location.href = "https://t.me/ashtemobile"; }, 3000);
                        }, 800); 
                    }
                }, 1200); 
            } catch (err) {
                status.innerText = 'Failed. Try again.'; status.style.color = '#ff453a';
                setTimeout(() => { pWrap.style.display = 'none'; btn.style.display = 'block'; status.style.display = 'none'; }, 3000);
            }
        };
    </script>
</body>
</html>
