name: 🧨 Nuke All Releases (Keep V1)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  nuke-releases:
    runs-on: ubuntu-latest
    steps:
      - name: 🧨 Delete ALL releases instantly except V1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "گەران بەدوای هەموو ڕیلیزەکاندا..."
          
          # هێنانی تا ١٠٠٠ ڕیلیز، جیاکردنەوەی V1، و سڕینەوەی هەمووی بەیەکجار
          gh release list --limit 1000 --json tagName -q '.[].tagName' | grep -v "^V1$" | tr '\n' '\0' | xargs -0 -I {} -P 20 bash -c 'gh release delete "{}" --cleanup-tag -y || true'
          
          echo "✅ هەموو ڕیلیزەکان سڕانەوە، تەنها V1 پارێزراوە!"
