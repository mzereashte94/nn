name: 🧨 Nuke All Releases (Keep V1)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  nuke-releases:
    runs-on: ubuntu-latest
    steps:
      - name: 🧨 Delete ALL releases instantly except V1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "گەران بەدوای هەموو ڕیلیزەکاندا..."
          
          # هێنانی هەموو ڕیلیسەکان و سڕینەوەیان بێ وەستان بە خێراییەکی زۆر
          gh release list --limit 1000 --json tagName -q '.[].tagName' | grep -v '^V1$' | while read -r tag; do
            if [ -n "$tag" ]; then
              gh release delete "$tag" --cleanup-tag -y &
            fi
          done
          
          # چاوەڕوان بوون تاوەکو هەموو پرۆسەکانی سڕینەوەی بەکۆمەڵ تەواو دەبن
          wait
          
          echo "✅ هەموو ڕیلیسەکان سڕانەوە، تەنها V1 پارێزراوە!"
