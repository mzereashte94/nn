name: 🧹 Auto Cleanup Background

on:
  workflow_run:
    # لێرەدا دەبێت ناوەکە ڕێک ناوی کۆدی سایینەرەکەت بێت
    workflows: ["Premium Cloud Signer Engine (Ultra Fast)"]
    types:
      - completed
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: ⏳ Wait 5 Minutes
        run: |
          echo "Waiting 5 minutes to let user download the app..."
          sleep 300

      - name: 🧹 Delete Old Cloud Build Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_TIME=$(date -u +%s)
          
          echo "Checking for old releases to delete..."
          
          # دەرهێنانی هەموو ڕیلیزەکان جگە لە V1
          gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.tag_name != "V1") | .tag_name + "|" + .created_at' | while IFS='|' read -r TAG CREATED_AT; do
            if [ -z "$TAG" ]; then continue; fi
            
            RELEASE_TIME=$(date -u -d "$CREATED_AT" +%s)
            DIFF=$(( (CURRENT_TIME - RELEASE_TIME) / 60 ))
            
            # ئەگەر تەمەنی ڕیلیزەکە ٤ خولەک یان زیاتر بوو بیسڕەوە
            if [ "$DIFF" -ge 4 ]; then
              echo "Deleting release: $TAG (Age: $DIFF minutes)"
              gh release delete "$TAG" --cleanup-tag -y || true
            else
              echo "Keeping release: $TAG (Age: $DIFF minutes - too new)"
            fi
          done
          
          echo "✅ Cleanup completed successfully!"
