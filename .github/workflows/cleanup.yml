name: 🧹 Ultra Auto Cleanup (Force)

on:
  schedule:
    - cron: '*/15 * * * *' # هەر ١٥ خولەک جارێک خۆی کار دەکات
  workflow_dispatch: # دەتوانیت بە دەستیش کاری پێ بکەیت

permissions:
  contents: write
  actions: write

jobs:
  force-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Delete ALL Releases Except V1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, json, subprocess
          
          repo = os.environ.get("GITHUB_REPOSITORY")
          print("🔄 Scanning all releases to delete everything except V1...")
          
          try:
              output = subprocess.check_output(["gh", "api", f"repos/{repo}/releases", "--paginate"]).decode("utf-8")
              releases = json.loads(output)
              deleted = 0
              
              for r in releases:
                  tag = r.get("tag_name", "")
                  
                  # پاراستنی V1 لە سڕینەوە (هەرگیز دەستی لێ نادات)
                  if tag == "V1":
                      print("🛡️ Skipping V1 (Safe - Apps kept)")
                      continue
                  
                  # سڕینەوەی بێبەزەییانەی هەر ڕیلیزێکی تر
                  print(f"🗑️ Deleting release and tag: {tag}")
                  os.system(f"gh release delete \"{tag}\" --cleanup-tag -y")
                  deleted += 1
                      
              if deleted == 0: 
                  print("✅ Clean repository! Nothing to delete.")
              else:
                  print(f"✅ Successfully deleted {deleted} old releases.")
                  
          except Exception as e: 
              print("❌ Error:", e)
          '
