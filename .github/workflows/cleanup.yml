name: 🧹 Ultra Strong Auto Cleanup

on:
  schedule:
    # هەر ٥ خولەک جارێک سێرڤەرەکە خەبەر دەکاتەوە بۆ پشکنین
    - cron: '*/5 * * * *'
  workflow_dispatch: # بۆ ئەوەی بتوانیت بە دەستی خۆیشت کاری پێ بکەیت

jobs:
  force-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: 🗑️ Force Delete Releases Older Than 10 Mins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting ultra-strong cleanup process..."
          
          # وەرگرتنی کاتی ئێستا بە سانیە
          NOW=$(date +%s)
          
          # هێنانەخوارەوەی لیستی هەموو ڕیلیزەکان، بەدەر لە V1
          RELEASES=$(gh api repos/${{ github.repository }}/releases --paginate -q '.[] | select(.tag_name != "V1") | "\(.tag_name)|\(.created_at)"')
          
          if [ -z "$RELEASES" ]; then
            echo "No releases found to clean up."
            exit 0
          fi
          
          for release in $RELEASES; do
            # جیاکردنەوەی تاگ و بەرواری دروستبوون
            TAG=$(echo "$release" | cut -d'|' -f1)
            CREATED_AT=$(echo "$release" | cut -d'|' -f2)
            
            # گۆڕینی بەرواری ڕیلیزەکە بۆ سانیە بۆ هەژمارکردنی دروست
            CREATED_TIMESTAMP=$(date -d "$CREATED_AT" +%s)
            
            # هەژمارکردنی تەمەنی ڕیلیزەکە بە خولەک
            DIFF_MINUTES=$(( (NOW - CREATED_TIMESTAMP) / 60 ))
            
            # ئەگەر تەمەنی ١٠ خولەک یان زیاتر بوو، بە زۆر دەیسڕێتەوە
            if [ "$DIFF_MINUTES" -ge 10 ]; then
              echo "⚠️ Deleting release '$TAG' (Age: $DIFF_MINUTES minutes)..."
              gh release delete "$TAG" --cleanup-tag -y || echo "Failed to delete $TAG, moving on..."
            else
              echo "✅ Keeping release '$TAG' (Age: $DIFF_MINUTES minutes - needs to wait)."
            fi
          done
          
          echo "Cleanup finished perfectly!"
