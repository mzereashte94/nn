name: 🧹 Ultra Auto Cleanup

on:
  workflow_run:
    workflows: ["signer.yml"]
    types:
      - completed
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  smart-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Wait 10 Minutes (If triggered by Signer)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          echo "Waiting 10 minutes to allow user to download..."
          sleep 600

      - name: 🧹 Smart Cleanup Engine (Python)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, json, subprocess
          from datetime import datetime, timezone
          
          repo = os.environ.get("GITHUB_REPOSITORY")
          print("🔄 Checking for old temporary releases...")
          
          try:
              output = subprocess.check_output(["gh", "api", f"repos/{repo}/releases", "--paginate"]).decode("utf-8")
              releases = json.loads(output)
              now = datetime.now(timezone.utc)
              deleted = 0
              
              for r in releases:
                  tag = r.get("tag_name", "")
                  
                  # دەست بۆ V1 نابات، بەڵام ئەوانەی بە Cloud Build دەست پێدەکەن دەسڕێتەوە
                  if tag == "V1" or not str(tag).startswith("Cloud Build"): 
                      continue
                  
                  created = datetime.strptime(r.get("created_at"), "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
                  mins = (now - created).total_seconds() / 60.0
                  
                  # ئەگەر تەمەنی لە ١٠ خولەک زیاتر بوو، دەیسڕێتەوە
                  if mins >= 10:
                      print(f"🗑️ Deleting: {tag} (Age: {mins:.1f} minutes)")
                      os.system(f"gh release delete {tag} --cleanup-tag -y")
                      deleted += 1
                      
              if deleted == 0: 
                  print("✅ No old temporary releases found.")
                  
          except Exception as e: 
              print("❌ Error during cleanup:", e)
          '
