name: 🧨 Nuke All Releases (Keep V1)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  nuke-releases:
    runs-on: ubuntu-latest
    steps:
      - name: 🧨 Delete ALL releases safely except V1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "دەستپێکردنی سڕینەوە بە شێوەیەکی سەلامەت..."
          
          # هێنانی ٣٠٠ ڕیلیس و سڕینەوەیان بە شێوەی ٣ دانە لە یەک کاتدا بۆ ئەوەی بلۆک نەبین
          gh release list --limit 300 --json tagName -q '.[].tagName' | grep -v '^V1$' | xargs -I {} -P 3 bash -c 'gh release delete "{}" --cleanup-tag -y || true'
          
          echo "✅ بەشێک لە ڕیلیسەکان سڕانەوە!"
