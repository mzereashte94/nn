name: 🧹 Safe & Complete Auto Cleanup

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  deep-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 🌪️ Delete All Old Releases (Except V1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, json, subprocess, time
          
          repo = os.environ.get("GITHUB_REPOSITORY")
          print("🔄 Fetching all 800+ releases...")
          
          try:
              # هێنانی هەموو ڕیلیزەکان
              output = subprocess.check_output(["gh", "api", f"repos/{repo}/releases", "--paginate"]).decode("utf-8")
              releases = json.loads(output)
              
              # جیاکردنەوەی هەموویان بێجگە لە V1
              tags_to_delete = [str(r.get("tag_name")) for r in releases if r.get("tag_name") and str(r.get("tag_name")) != "V1"]
              
              if not tags_to_delete:
                  print("✅ Clean repository! Nothing to delete.")
                  exit(0)
                  
              print(f"🌪️ Found {len(tags_to_delete)} releases! Starting safe deletion...")
              
              deleted = 0
              for tag in tags_to_delete:
                  print(f"🗑️ Deleting: {tag} ...")
                  # بەکارهێنانی subprocess بۆ ئەوەی ئەگەر ناوی ڕیلیزەکە بۆشایی تێدابوو کێشە دروست نەکات
                  res = subprocess.run(["gh", "release", "delete", tag, "--cleanup-tag", "-y"], capture_output=True)
                  
                  if res.returncode == 0:
                      deleted += 1
                  
                  # پشوویەکی بچووک (نیو چرکە) بۆ ئەوەی گیت هاب بلۆکمان نەکات
                  time.sleep(0.4)
                      
              print(f"✅ SUCCESSFULLY DELETED {deleted} RELEASES!")
                  
          except Exception as e: 
              print("❌ Error:", e)
          '
