name: 🧹 Auto Cleanup Background

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: 🗑️ Delete Releases Older Than 5 Mins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_TIME=$(date -u +%s)
          
          echo "Starting cleanup process..."
          
          # وەرگرتنی هەموو ڕیلیزەکان جگە لە V1
          gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.tag_name != "V1") | .tag_name + "|" + .created_at' | while IFS='|' read -r TAG CREATED_AT; do
            if [ -z "$TAG" ]; then continue; fi
            
            RELEASE_TIME=$(date -u -d "$CREATED_AT" +%s)
            DIFF=$(( (CURRENT_TIME - RELEASE_TIME) / 60 ))
            
            if [ "$DIFF" -ge 5 ]; then
              echo "Deleting old release: $TAG (Age: $DIFF minutes)..."
              gh release delete "$TAG" --cleanup-tag -y || true
            else
              echo "Keeping new release: $TAG (Age: $DIFF minutes)"
            fi
          done
          
          echo "Cleanup finished successfully!"
